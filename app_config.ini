; MODE: "develop" hoac "release"
; - develop: kiem tra cap nhat tu ban prerelease tren GitHub, build se day len nhanh "develop"
; - release: kiem tra cap nhat tu ban chinh thuc tren GitHub, build se day thang len nhanh "main"
;            va tao kem GitHub Release chinh thuc (khong danh dau prerelease)
MODE=develop

; APP_NAME: Ten hien thi cua tool (tieu de cua so, man hinh huong dan su dung...)
APP_NAME=Facebook Group Auto Poster Pro

; EXE_NAME: Ten file .exe se duoc tao ra khi build (khong dau, khong dung khoang trang)
EXE_NAME=FaceBook_Group_AutoPoster_Pro.exe

; VERSION_OVERRIDE: De trong -> build se TU DONG tang version (vi du 1.0.11 -> 1.0.12).
; Dien vao day neu ban muon EP mot version cu the (vi du: 2.0.0) de nhay len cao hon
; thay vi tang dan tu dong. Sau khi build xong, gia tri nay se TU DONG duoc XOA VE TRONG
; de lan build ke tiep quay lai tu dong tang tiep tu chinh version vua ep.
VERSION_OVERRIDE=
